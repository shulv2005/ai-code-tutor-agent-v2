[project]
name = "ai-code-tutor-agent"
version = "0.1.0"
description = "AI 代码导师：代码检测 / 改错 / 注释 + 错题本与举一反三（本地 SQLite，双击 start.bat 即用）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    # 前端上传代码文件用（FastAPI 解析 multipart/form-data 必需）
    "python-multipart>=0.0.9",
    # 数据库：本地 SQLite（错题本也在这里）+ 异步驱动
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    # greenlet 必须**显式**写出来，不能指望 sqlalchemy 帮你带。
    # SQLAlchemy 的 async 引擎（create_async_engine → await 会话）底层靠它，
    # 但 sqlalchemy 对它的依赖标记是
    #   greenlet>=1; platform_machine == "aarch64" or ... "x86_64" or ...
    # 在 ARM64 等不在名单里的机器上，pip 会**跳过** greenlet，
    # sqlalchemy 装得上、import 也不报错，直到真正建异步引擎才炸：
    #   ModuleNotFoundError: No module named 'greenlet'
    # 对使用者来说就是"新电脑上双击 start.bat 弹一屏英文堆栈"。
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    # 通用 LLM 客户端（app/core/llm_client.py）：官方 SDK，负责鉴权头、
    # 超时与 SSE 流式解析；项目自管重试与错误映射（见该文件模块注释）
    "openai>=1.40.0",
    # 多语言代码解析（本地语法检查 + /analyze 的结构解析）。
    # 注意：语法包必须用「自带编译产物」的独立 wheel（tree-sitter-python 等）。
    # 不要用 tree-sitter-language-pack —— 它在运行时从 GitHub 下载 parsers.json
    # 与语法动态库，内网/离线/CI 环境会直接 DownloadError 超时失败。
    # c 与 java 是「AI 代码导师」面向的学习语言。
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-java>=0.23",
    # 【已移除】原先「开源贡献端」用的 GitPython / rank_bm25 / faiss-cpu /
    # numpy / fastembed / jieba / docker 已随该功能整体删除，
    # 安装体积从几百 MB 降到几十 MB。
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 测试文件里大量中文 docstring/断言消息，硬折行会显著降低可读性；
# 测试内的 subprocess 调用是刻意的（验收脚本要真起服务）。
"tests/*" = ["E501", "ASYNC240", "ASYNC221"]
# B008：ruff 认为「函数调用不应出现在参数默认值里」，这条规则适用于普通函数，
# 但 FastAPI 的文件上传**必须**写成 `file: UploadFile = File(...)`——
# 依赖注入靠的就是这个默认值。官方推荐写法与 B008 冲突，故对本文件豁免。
"app/api/v1/endpoints/tutor.py" = ["B008"]
# 同理：`payload: FileScanRequest | None = Body(default=None)` 让请求体可选
# （不带 body 直接 POST /files/scan 也要能用），这是 FastAPI 的官方写法。
"app/api/v1/endpoints/files.py" = ["B008"]
# E501：`DIAGNOSE_SYSTEM` 是需求给定的 System Prompt，**必须逐字使用**，
# 其中几行本来就超过 100 字符。为了折行去改动提示词文案是本末倒置
# （提示词里的每一处强调都影响模型是否守格式），因此对该文件豁免行宽。
"app/agents/tutor_agent.py" = ["E501"]
# tools/ 下是人工验收脚本，不是产品代码：
#   E501：大量中文 print 语句，硬折行会把"逐行对齐的输出"折得看不清；
#   E402：check_frontend.py 必须先把项目根目录插进 sys.path 才能 import app。
"tools/*" = ["E501", "E402"]

